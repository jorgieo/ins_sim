[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ins_sim"
version = "0.1.1"
description = "Navigation-grade IMU/strapdown inertial navigation simulation"
authors = [{name = "J.L. Otero"}]
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "kaleido"]
gui = ["PySide6"]
docs = ["mkdocs", "mkdocs-material"]

[tool.setuptools.packages.find]
include = ["ins_sim*"]

[tool.setuptools.package-data]
ins_sim = ["config/*.yaml"]
