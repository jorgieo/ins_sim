[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ins_sim"
version = "0.3.0.dev0"
description = "Navigation-grade IMU/strapdown inertial navigation simulation"
authors = [{name = "J.L. Otero"}]
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",          # Generator.spawn (per-source random streams)
    "scipy",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "kaleido"]
gui = ["PySide6"]
# MkDocs 2.0 drops the plugin system that mkdocs-material and mkdocstrings
# rely on, so stay on the 1.x line.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mike>=2.1",
]

[tool.setuptools.packages.find]
include = ["ins_sim*"]

[tool.setuptools.package-data]
ins_sim = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "ins_sim"]
# Runs the Examples: sections of public docstrings as doctests. The Qt
# modules are excluded from collection in conftest.py.
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS NUMBER"
