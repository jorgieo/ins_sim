<svg viewBox="0 0 620 380" role="img" aria-labelledby="ellipsoid-title" xmlns="http://www.w3.org/2000/svg">
<title id="ellipsoid-title">A meridian section of the ellipsoid, showing geodetic latitude, height and the transverse radius of curvature</title>
<ellipse class="body-fill" cx="240" cy="200" rx="170" ry="140"/>
<text class="muted" x="52" y="96">Ellipsoid</text>
<line class="stroke-thin" x1="240" y1="40" x2="240" y2="365"/>
<text class="muted" x="248" y="52">Polar axis</text>
<line class="stroke-thin dashed" x1="50" y1="200" x2="440" y2="200"/>
<text class="muted" x="448" y="205">Equatorial plane</text>
<circle class="dot" cx="240" cy="200" r="2.5"/>
<line class="stroke" x1="371.2" y1="111" x2="240" y2="242.2"/>
<circle class="dot" cx="240" cy="242.2" r="3"/>
<text x="292" y="165" text-anchor="end">R<tspan dy="4" font-size="11">E</tspan></text>
<path class="stroke-accent" d="M 310.2 200 A 28 28 0 0 0 302 180.2"/>
<text class="accent" x="316" y="191">L<tspan dy="4" font-size="11">b</tspan></text>
<line class="stroke-accent" x1="399.5" y1="82.7" x2="371.2" y2="111"/>
<text class="accent" x="397" y="113">h<tspan dy="4" font-size="11">b</tspan></text>
<circle class="dot" cx="371.2" cy="111" r="3"/>
<circle class="dot" cx="399.5" cy="82.7" r="5"/>
<text x="410" y="80">body, b</text>
</svg>
