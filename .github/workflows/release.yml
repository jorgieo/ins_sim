# Cross-platform release pipeline.
#
# - Pushes to release/* branches: build, smoke-test, and upload workflow
#   artifacts (a dry run of the release without publishing anything).
# - Pushes of v* tags: additionally create a GitHub Release with the
#   binaries attached.
#
# Compatibility note: Linux binaries built on ubuntu-latest (24.04)
# require a similarly recent glibc on the target machine. Pin
# ubuntu-22.04 here if wider compatibility is needed.
#
# Architectures: x86_64 Linux/Windows plus a native aarch64 Linux
# bundle built on GitHub's ubuntu-24.04-arm runner (for Raspberry Pi
# 4/5 on 64-bit OS and other ARM64 Linux). See the build matrix below.

name: Release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # arch feeds the archive/artifact/release-asset names below.
        # ubuntu-24.04-arm is GitHub's native ARM64 runner (free for
        # public repos) — a real aarch64 build, no QEMU emulation.
        include:
          - os: windows-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[gui]" pyinstaller pytest

      # python -m puts the repo root on sys.path, which
      # tests/test_integration.py needs to import the root main.py
      - name: Run test suite
        run: python -m pytest -q

      - name: Install QtWebEngine runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libasound2t64

      - name: Build bundle
        run: pyinstaller ins_sim.spec --noconfirm

      # The exe is GUI-subsystem: the shell won't wait for it (and would
      # ignore its exit code), so launch it explicitly and propagate.
      - name: Smoke-test frozen app (Windows)
        if: runner.os == 'Windows'
        env:
          INS_SIM_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/ins_sim/ins_sim.exe" -Wait -PassThru
          exit $p.ExitCode

      - name: Smoke-test frozen app (Linux)
        if: runner.os == 'Linux'
        env:
          INS_SIM_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
        run: dist/ins_sim/ins_sim

      # Branch refs contain slashes (release/foo) — sanitize for filenames.
      - name: Compute version label
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ins_sim -DestinationPath "ins_sim-${{ env.VERSION }}-windows-${{ matrix.arch }}.zip"

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: tar czf "ins_sim-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz" -C dist ins_sim

      - name: Upload workflow artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ins_sim-windows-${{ matrix.arch }}
          path: ins_sim-*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      # arch in the name keeps the x86_64 and aarch64 Linux jobs from
      # colliding on the artifact name.
      - name: Upload workflow artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ins_sim-linux-${{ matrix.arch }}
          path: ins_sim-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release (tags only, Windows asset)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ins_sim-*-windows-${{ matrix.arch }}.zip

      # Each Linux job (x86_64, aarch64) uploads only its own asset; the
      # action appends to the same release across matrix jobs.
      - name: Create GitHub Release (tags only, Linux asset)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: ins_sim-*-linux-${{ matrix.arch }}.tar.gz
