<path class="stroke" d="M 447.2 340.2 L 456.8 349.8 M 447.2 349.8 L 456.8 340.2"/>
<text x="467" y="350">z<tspan dy="4" font-size="11">b</tspan><tspan dy="-4" class="muted"> points down, into the page</tspan></text>
</svg>
